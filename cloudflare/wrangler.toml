name = "cameroon-laws-rag"
main = "worker.py"
compatibility_date = "2024-01-01"

# R2 Bucket binding
[[r2_buckets]]
binding = "LAWS_INDEX"
bucket_name = "cameroon-laws-index"

# Environment variables
[vars]
DEEPSEEK_API_KEY = "sk-941d68a6421e4c3cb2bb17f4e53d258a"

# Secrets (set via: wrangler secret put R2_ACCESS_KEY_ID)
# R2_ACCOUNT_ID
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY

[build]
command = "pip install -r requirements.txt -t ."

[build.upload]
format = "service-worker"
